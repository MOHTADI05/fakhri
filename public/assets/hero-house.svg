<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" role="img" aria-label="Maison en maçonnerie">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE3"/>
      <stop offset="55%" stop-color="#E8DFC8"/>
      <stop offset="100%" stop-color="#D9CEB5"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F08A3A"/>
      <stop offset="45%" stop-color="#E8741E"/>
      <stop offset="100%" stop-color="#B85110"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C45A18"/>
      <stop offset="50%" stop-color="#D96A22"/>
      <stop offset="100%" stop-color="#A84812"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A4210"/>
      <stop offset="100%" stop-color="#7A340C"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9BDA3"/>
      <stop offset="100%" stop-color="#B5A88C"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3530"/>
      <stop offset="100%" stop-color="#1A1A17"/>
    </linearGradient>
    <radialGradient id="softShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A17" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#1A1A17" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bricks" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#D96A22"/>
      <rect x="1" y="1" width="22" height="10" rx="1" fill="#E07A32" stroke="#8F3F0E" stroke-width="0.6"/>
      <rect x="25" y="1" width="22" height="10" rx="1" fill="#C75A16" stroke="#8F3F0E" stroke-width="0.6"/>
      <rect x="-11" y="13" width="22" height="10" rx="1" fill="#C45A18" stroke="#8F3F0E" stroke-width="0.6"/>
      <rect x="13" y="13" width="22" height="10" rx="1" fill="#E8741E" stroke="#8F3F0E" stroke-width="0.6"/>
      <rect x="37" y="13" width="22" height="10" rx="1" fill="#B85110" stroke="#8F3F0E" stroke-width="0.6"/>
    </pattern>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1A1A17" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="900" fill="url(#sky)"/>

  <!-- Ground plane -->
  <ellipse cx="400" cy="780" rx="260" ry="36" fill="url(#softShadow)"/>
  <path d="M120 760 Q400 820 680 760 L700 900 L100 900 Z" fill="url(#ground)" opacity="0.55"/>

  <g filter="url(#depth)">
    <!-- Foundation -->
    <path d="M210 690 L590 690 L610 720 L190 720 Z" fill="url(#slab)"/>
    <path d="M190 720 L610 720 L600 735 L200 735 Z" fill="#12110F"/>

    <!-- Side wall (perspective) -->
    <path d="M520 360 L620 400 L620 690 L520 690 Z" fill="url(#wallR)"/>
    <path d="M520 360 L620 400 L580 330 Z" fill="#8A3A0E" opacity="0.85"/>

    <!-- Front wall -->
    <path d="M210 400 L520 360 L520 690 L210 690 Z" fill="url(#bricks)"/>
    <path d="M210 400 L520 360 L520 690 L210 690 Z" fill="url(#wallL)" opacity="0.35"/>

    <!-- Roof -->
    <path d="M180 410 L365 210 L540 350 L210 400 Z" fill="url(#roofGrad)"/>
    <path d="M540 350 L640 390 L620 400 L520 360 Z" fill="#9A4210"/>
    <path d="M365 210 L540 350 L640 390 L465 250 Z" fill="#C45A18"/>
    <!-- Roof ridge highlight -->
    <path d="M365 210 L465 250" stroke="#FFB070" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <!-- Tiles suggestion -->
    <path d="M220 390 L350 250 M260 395 L380 265 M300 398 L410 280 M340 400 L440 295 M380 395 L470 310 M420 385 L500 325" stroke="#8F3F0E" stroke-width="1.2" opacity="0.35"/>

    <!-- Door recess -->
    <path d="M320 520 L420 512 L420 690 L320 690 Z" fill="#1A1A17"/>
    <path d="M328 528 L412 521 L412 690 L328 690 Z" fill="#2C241C"/>
    <rect x="400" y="595" width="6" height="18" rx="2" fill="#E8741E"/>

    <!-- Windows -->
    <g>
      <rect x="250" y="470" width="54" height="64" rx="3" fill="#1A1A17"/>
      <rect x="255" y="475" width="44" height="54" rx="2" fill="#D6E8F2" opacity="0.85"/>
      <path d="M277 475 V529 M255 502 H299" stroke="#1A1A17" stroke-width="2.5" opacity="0.55"/>
      <rect x="255" y="475" width="44" height="10" fill="#fff" opacity="0.2"/>
    </g>
    <g>
      <rect x="445" y="455" width="54" height="64" rx="3" fill="#1A1A17"/>
      <rect x="450" y="460" width="44" height="54" rx="2" fill="#C5DCE8" opacity="0.8"/>
      <path d="M472 460 V514 M450 487 H494" stroke="#1A1A17" stroke-width="2.5" opacity="0.55"/>
      <rect x="450" y="460" width="44" height="10" fill="#fff" opacity="0.18"/>
    </g>

    <!-- Scaffold hint -->
    <g stroke="#E8741E" stroke-width="2" fill="none" opacity="0.45">
      <path d="M175 690 V420"/>
      <path d="M175 500 H230"/>
      <path d="M175 560 H230"/>
      <path d="M175 620 H230"/>
    </g>

    <!-- Loose bricks at base -->
    <g>
      <rect x="560" y="700" width="38" height="16" rx="2" fill="#E8741E" transform="rotate(-8 579 708)"/>
      <rect x="590" y="712" width="34" height="15" rx="2" fill="#C45A18" transform="rotate(6 607 720)"/>
      <rect x="175" y="705" width="36" height="15" rx="2" fill="#D96A22" transform="rotate(12 193 712)"/>
    </g>
  </g>

  <!-- Soft vignette -->
  <rect width="800" height="900" fill="url(#sky)" opacity="0" />
</svg>
